name: build

on:
  push:
    branches: [master, dev, modernize]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install siblings not published to Maven Central
        # Built and installed here, in dependency order, because a standalone
        # build cannot resolve them from central. Tags are pinned so a run is
        # reproducible rather than depending on what a branch holds today.
        run: |
          for pair in "common-json:v1.1.0" "common-sqlitejdbc:v1.1.0"; do
            repo="${pair%%:*}"
            tag="${pair##*:}"
            git clone --depth 1 --branch "$tag" \
              "https://github.com/deepsidhu1313/$repo.git" "$RUNNER_TEMP/$repo"
            (cd "$RUNNER_TEMP/$repo" && mvn -B -q install \
              -DskipTests -Dgpg.skip -Dmaven.javadoc.skip=true -Dmaven.source.skip=true)
          done
        shell: bash
      - name: Build and test
        run: ./mvnw -B verify -Dgpg.skip
        shell: bash
